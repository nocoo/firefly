# CI slot standard v1 (nocoo/base-ci docs/slots.md): S1–G2, B1, L1, L1.5, L2, L3, S3, Z1 via quality.yml;
# P1 na in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L2/L3 test-env-json, L3 evidence artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.2.15"
      install-policy: project
      extra-install-dirs: worker
      coverage-path: ""
      test-command: bun run test:coverage
      osv-config: osv-scanner.toml
      gitleaks-config: .gitleaks.toml
      lockfiles: |
        bun.lock
        worker/bun.lock
      build: true
      build-command: bun run build
      worker: true
      worker-directory: worker
      worker-command: bun run test:coverage
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-docker.yml
      workflow-lint-yamllint: true
      l2: true
      l2-command: bun run test:e2e:api
      l3: true
      l3-browser: chromium
      l3-command: bun run test:e2e:browser
      l3-artifact-name: browser-evidence
      l3-artifact-path: |
        test-results/
        playwright-report/
      l3-artifact-retention-days: 7
      env-json: '{"CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "impl"},
        "L2": {"status": "impl"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
    secrets:
      test-env-json: ${{ format('{{"AUTH_SECRET":{0},"AUTH_ALLOWED_EMAILS":{1}}}', toJSON(secrets.AUTH_SECRET), toJSON(secrets.AUTH_ALLOWED_EMAILS)) }}

  # Linux 主机网络下对已构建容器镜像跑 API E2E；不属于 slots.md 的 L2 槽位（验证 Docker 产物而非进程内 HTTP）。
  container-e2e:
    name: "Container L2 E2E"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.2.15"
      install-policy: project
      extra-install-dirs: worker
      timeout-minutes: 25
      command: |
        docker build --tag firefly-ci:${{ github.sha }} \
          --build-arg AUTH_URL=http://localhost:17028 \
          --build-arg R2_PUBLIC_URL=http://localhost:17028/__e2e-r2 .
        bun scripts/run-e2e.ts --api-only --container-image=firefly-ci:${{ github.sha }}
      env-json: '{"AUTH_URL": "http://localhost:17028", "CI": "true"}'
    secrets:
      test-env-json: ${{ format('{{"AUTH_SECRET":{0},"AUTH_ALLOWED_EMAILS":{1}}}', toJSON(secrets.AUTH_SECRET), toJSON(secrets.AUTH_ALLOWED_EMAILS)) }}
