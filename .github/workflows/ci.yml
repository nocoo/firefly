name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────
  # L1 + G1 + G2 — Core quality gate from base-ci
  # ─────────────────────────────────────────────────────
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae  # main 2026-10-22
    with:
      runtime-version: "1.2.15"
      install-policy: "blocked"
      coverage-path: ""
      extra-install-dirs: "worker"
      test-command: "bun run test:coverage"
      osv-config: "osv-scanner.toml"

  # ─────────────────────────────────────────────────────
  # L2: API E2E (fully local — Miniflare D1 + filesystem R2)
  # Runs in PARALLEL with quality for faster CI.
  # ─────────────────────────────────────────────────────
  api-e2e:
    name: "L2 API E2E"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae  # main 2026-10-22
    with:
      runtime-version: "1.2.15"
      install-policy: "project"
      extra-install-dirs: "worker"
      timeout-minutes: 20
      command: "bun run test:e2e:api"
      env-json: '{"AUTH_URL": "http://localhost:17028"}'
    secrets:
      test-env-json: ${{ format('{{"AUTH_SECRET":{0},"AUTH_ALLOWED_EMAILS":{1}}}', toJSON(secrets.AUTH_SECRET), toJSON(secrets.AUTH_ALLOWED_EMAILS)) }}

  # ─────────────────────────────────────────────────────
  # L3: Browser E2E (fully local — same as L2)
  # Runs in PARALLEL with quality for faster CI.
  # ─────────────────────────────────────────────────────
  browser-e2e:
    name: "L3 Browser E2E"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae  # main 2026-10-22
    with:
      runtime-version: "1.2.15"
      install-policy: "project"
      extra-install-dirs: "worker"
      browser: "chromium"
      timeout-minutes: 25
      command: "bun run test:e2e:browser"
      env-json: '{"AUTH_URL": "http://localhost:27028"}'
    secrets:
      test-env-json: ${{ format('{{"AUTH_SECRET":{0},"AUTH_ALLOWED_EMAILS":{1}}}', toJSON(secrets.AUTH_SECRET), toJSON(secrets.AUTH_ALLOWED_EMAILS)) }}

  # ─────────────────────────────────────────────────────
  # Worker: Edge Worker unit tests
  # Runs in PARALLEL with quality for faster CI.
  # ─────────────────────────────────────────────────────
  worker-tests:
    name: "Worker Tests"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae  # main 2026-10-22
    with:
      runtime-version: "1.2.15"
      install-policy: "project"
      working-directory: "worker"
      timeout-minutes: 10
      command: "bun run test"

  container-e2e:
    name: "Container L2 E2E"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae  # main 2026-10-22
    with:
      runtime-version: "1.2.15"
      install-policy: "project"
      extra-install-dirs: "worker"
      timeout-minutes: 25
      command: |
        docker build --tag firefly-ci:${{ github.sha }} \
          --build-arg AUTH_URL=http://localhost:17028 \
          --build-arg R2_PUBLIC_URL=http://localhost:17028/__e2e-r2 .
        bun scripts/run-e2e.ts --api-only --container-image=firefly-ci:${{ github.sha }}

  release-smoke:
    name: "Release Workflow Smoke"
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae  # main 2026-10-22
    with:
      required-reusable-workflow: "nocoo/base-ci/.github/workflows/deploy-docker.yml"
      yamllint: true
