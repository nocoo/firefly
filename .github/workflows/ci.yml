# System0 native mode: this workflow only calls the repository's own slot workflow,
# so every check renders as `quality / <ID>: <Name>` and `quality / Z1: Gate` is the
# single required check. base-ci provides composite actions, pinned by full SHA.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml
    secrets:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_ALLOWED_EMAILS: ${{ secrets.AUTH_ALLOWED_EMAILS }}
