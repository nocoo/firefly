title = "Firefly gitleaks config"

# Without this section a config file replaces the built-in rule set instead of
# extending it, which silently turned every scan into a no-op.
[extend]
useDefault = true

[allowlist]
  description = "Known non-secret patterns in test fixtures"

  # Test fixtures with fake API keys / tokens
  paths = [
    '''e2e/.*\.test\.ts$''',
    '''e2e/.*\.spec\.ts$''',
    '''\.env\.test$''',
    '''\.env\.example$''',
  ]
