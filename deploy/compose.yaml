services:
  web:
    image: ghcr.io/nocoo/firefly:${IMAGE_SHA:?IMAGE_SHA is required}
    container_name: firefly-app
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.runtime
        required: true
        format: raw
    environment:
      PORT: "7028"
      HOSTNAME: 0.0.0.0
    ports:
      - 127.0.0.1:17028:7028
    mem_limit: 8g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7028/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - edge

networks:
  edge:
    external: true
